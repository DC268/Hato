services:
  - type: web
    name: hato-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: HATO_DB_URL
        value: jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
      - key: HATO_DB_USER
        value: postgres.jlzwhsalduizhuvccsxi
      - key: HATO_DB_PASSWORD
        sync: false
      - key: HATO_JWT_SECRET
        generateValue: true
      - key: HATO_INGEST_KEY
        value: hato-secret-ingest-key-2026
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: HATO_GPS_TCP_PORT
        value: 5023
