services:
  - type: web
    name: hato-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: HATO_DB_URL
        sync: false
        # Ejemplo Supabase: jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:6543/postgres?sslmode=require
      - key: HATO_DB_USER
        sync: false
      - key: HATO_DB_PASSWORD
        sync: false
      - key: HATO_JWT_SECRET
        generateValue: true
      - key: HATO_INGEST_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: HATO_GPS_TCP_PORT
        value: 5023
